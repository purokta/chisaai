name: Build APK
# Membuat chisa-ai.apk (bot + Node.js di dalam aplikasi). Jalankan manual: tab Actions > Build APK > Run workflow.
# Hasil: Releases > "CHISA-AI APK" (link tetap) atau artifact di halaman run.
on:
  workflow_dispatch:
    inputs:
      ffmpeg:
        description: 'Sertakan ffmpeg (stiker, voice note, play audio). Matikan kalau APK gagal dipasang'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['package.json', 'android/**', '.github/workflows/apk.yml']

permissions:
  contents: write

# push + Run workflow bersamaan bisa saling tabrak saat menerbitkan rilis; yang lama dibatalkan
concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Siapkan Android SDK (sudah terpasang di server GitHub, ini hanya melengkapi)
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125" || true

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }

      - name: Ambil Node.js untuk Android (nodejs-mobile)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p /tmp/nm
          gh release download -R nodejs-mobile/nodejs-mobile --pattern '*android*.zip' --dir /tmp/nm
          unzip -q /tmp/nm/*.zip -d /tmp/nm/x
          for ABI in arm64-v8a armeabi-v7a; do
            SO=$(find /tmp/nm/x -path "*/$ABI/libnode.so" | head -1)
            [ -n "$SO" ] || { echo "libnode.so $ABI tidak ditemukan"; find /tmp/nm/x | head -50; exit 1; }
            mkdir -p android/app/libnode/bin/$ABI
            cp "$SO" android/app/libnode/bin/$ABI/libnode.so
          done
          mkdir -p android/app/libnode/include/node
          H=$(find /tmp/nm/x -name node.h | head -1)
          cp -r "$(dirname "$H")"/. android/app/libnode/include/node/
          ls -la android/app/libnode/bin/*

      - name: Paketkan bot + modul npm
        timeout-minutes: 12
        env:
          CI: 'true'
          GIT_TERMINAL_PROMPT: '0'
          GIT_SSH_COMMAND: 'ssh -o BatchMode=yes -o StrictHostKeyChecking=no'
        run: |
          # paket yang diambil lewat git/ssh dialihkan ke https supaya tidak menunggu konfirmasi
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "git://github.com/"
          mkdir -p /tmp/stage/bot android/app/src/main/assets
          rsync -a --exclude=android --exclude=.git --exclude=.github --exclude=node_modules --exclude=docs ./ /tmp/stage/bot/
          cd /tmp/stage/bot
          npm install --omit=dev --legacy-peer-deps --ignore-scripts --no-audit --no-fund --loglevel=http
          cd /tmp/stage
          zip -qr9 "$GITHUB_WORKSPACE/android/app/src/main/assets/bot.zip" bot
          ls -la "$GITHUB_WORKSPACE/android/app/src/main/assets/"

      - name: ffmpeg untuk stiker/video (aktif bawaan; bisa dimatikan saat Run workflow)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.ffmpeg }}
        continue-on-error: true
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          curl -fsSL -o android/app/src/main/jniLibs/arm64-v8a/libffmpeg.so https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-linux-arm64
          chmod +x android/app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          F=android/app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          file "$F" || true
          # hanya dipakai kalau benar-benar program ARM64; kalau bukan, dibuang supaya APK tetap bisa dipasang
          if ! file "$F" | grep -q 'ELF 64-bit.*aarch64'; then echo "ffmpeg tidak valid, dibuang"; rm -f "$F"; fi

      - name: Build APK
        env:
          APK_VERSION_CODE: ${{ github.run_number }}
        shell: bash
        run: |
          set -o pipefail
          export APK_VERSION_NAME=$(node -p "require('./package.json').version")
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log
          cp android/app/build/outputs/apk/release/app-release.apk chisa-ai.apk
          cp chisa-ai.apk "chisa-ai-v${APK_VERSION_NAME}.apk"
          ls -la chisa-ai*.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "--- tanda tangan"; "$BT/apksigner" verify --verbose --print-certs chisa-ai.apk | head -12 || true
          echo "--- info paket"; "$BT/aapt2" dump badging chisa-ai.apk | grep -E "^package|sdkVersion|targetSdk|native-code" || true
          echo "--- library"; unzip -l chisa-ai.apk | grep -E "\.so|bot.zip" || true

      - name: Tampilkan penyebab error
        if: failure()
        run: |
          echo "=============== PENYEBAB ==============="
          grep -nE "error:|e: |What went wrong|Execution failed|AAPT|error \\(|not found|cannot find" -A6 gradle-build.log | head -80 || true

      - name: Simpan log kalau gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-gagal
          path: |
            gradle-build.log
            android/app/build/reports/**
          if-no-files-found: ignore

      - name: Nama berkas berversi
        id: ver
        run: |
          V=$(node -p "require('./package.json').version")
          echo "v=$V" >> "$GITHUB_OUTPUT"
          rm chisa-ai.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chisa-ai-apk-v${{ steps.ver.outputs.v }}
          path: chisa-ai-v${{ steps.ver.outputs.v }}.apk

      - name: Terbitkan di Releases
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V=$(node -p "require('./package.json').version")
          gh release delete apk-latest -y --cleanup-tag || true
          NOTES=$(printf 'CHISA-AI v%s (APK). Pasang, isi nomor, tekan MULAI BOT. Pasang di atas versi lama untuk memperbarui (login & data tetap).\n\nversionCode: %s' "$V" "${{ github.run_number }}")
          gh release create apk-latest "chisa-ai-v${V}.apk" --title "CHISA-AI APK v${V}" --notes "$NOTES"
